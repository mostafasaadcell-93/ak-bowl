<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AK Bowl · Owner panel</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#2E1A12">
<link rel="icon" href="assets/pod.png">
<style>
@font-face{font-family:"League Spartan";font-weight:800;font-style:normal;font-display:swap;src:url(assets/fonts/league-spartan-latin-800-normal.woff2) format("woff2")}
@font-face{font-family:"League Spartan";font-weight:900;font-style:normal;font-display:swap;src:url(assets/fonts/league-spartan-latin-900-normal.woff2) format("woff2")}
@font-face{font-family:"Montserrat";font-weight:400;font-style:normal;font-display:swap;src:url(assets/fonts/montserrat-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Montserrat";font-weight:600;font-style:normal;font-display:swap;src:url(assets/fonts/montserrat-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Montserrat";font-weight:700;font-style:normal;font-display:swap;src:url(assets/fonts/montserrat-latin-700-normal.woff2) format("woff2")}
:root{--sand:#EFE3CF;--sand2:#E5D4B8;--paper:#FBF6EE;--cocoa:#2E1A12;--cocoa2:#6A4B3B;--line:rgba(46,26,18,.13);--ok:#2E7D32;--bad:#A8261F;--acc:#D9302C;
  --spartan:"League Spartan","Montserrat",system-ui,sans-serif;--sans:"Montserrat",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--sand);color:var(--cocoa);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:inherit}
:focus-visible{outline:2.5px solid var(--acc);outline-offset:2px;border-radius:8px}
[hidden]{display:none!important}
h1,h2,h3{font-family:var(--spartan);font-weight:900;letter-spacing:-.02em;line-height:1}

/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:24px}
.login .box{width:min(440px,100%);background:var(--paper);border-radius:30px;padding:34px 28px;box-shadow:0 40px 80px -50px rgba(46,26,18,.6)}
.login img{width:190px;margin:0 auto 18px;display:block}
.login h1{font-size:34px;text-align:center}
.login p.s{text-align:center;color:var(--cocoa2);margin:8px 0 24px}
.login details{margin-top:12px;font-size:13px;color:var(--cocoa2)}
.login summary{cursor:pointer;font-weight:600}
.login .alt{display:block;width:100%;margin-top:12px;text-align:center;font-weight:600;font-size:14px;color:var(--cocoa2);text-decoration:underline}
.err{color:var(--bad);font-size:13px;font-weight:600;min-height:1px;margin-top:6px}

/* shell */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:12px clamp(14px,3vw,28px);background:rgba(239,227,207,.9);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top img{height:34px}
.top .who{font-size:12px;color:var(--cocoa2);font-weight:600;line-height:1.2}
.top .who b{display:block;color:var(--cocoa);font-family:var(--spartan);font-size:16px;font-weight:900}
.top .sp{flex:1}
.status{font-size:12.5px;font-weight:700;padding:7px 12px;border-radius:999px;background:var(--paper);white-space:nowrap}
.status.dirty{background:#FFE7B8;color:#7A4B00}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border-radius:999px;background:var(--cocoa);color:var(--paper);font-family:var(--spartan);font-weight:800;font-size:15px;letter-spacing:.03em;white-space:nowrap;transition:transform .2s,opacity .2s}
.btn:hover{transform:translateY(-1px)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.ghost{background:transparent;color:var(--cocoa);box-shadow:inset 0 0 0 1.5px var(--cocoa)}
.btn.red{background:var(--bad)}
.btn.sm{height:36px;padding:0 14px;font-size:13px}
.btn svg{width:17px;height:17px}
.layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:28px;max-width:1180px;margin:0 auto;padding:24px clamp(14px,3vw,28px) 120px}
.nav{position:sticky;top:84px;align-self:start;display:grid;gap:4px}
.nav button{display:flex;align-items:center;gap:12px;height:48px;padding:0 14px;border-radius:14px;font-weight:600;text-align:left;transition:background .2s}
.nav button svg{width:20px;height:20px;flex:none}
.nav button:hover{background:rgba(255,255,255,.4)}
.nav button[aria-current="page"]{background:var(--cocoa);color:var(--paper)}
.nav .n{margin-left:auto;font-size:11px;font-weight:700;background:var(--bad);color:#fff;border-radius:999px;padding:2px 7px}
.page h2{font-size:clamp(30px,4vw,42px);margin-bottom:6px}
.page .lead{color:var(--cocoa2);margin-bottom:22px;max-width:60ch}
.card{background:var(--paper);border-radius:24px;padding:22px;box-shadow:0 1px 0 rgba(255,255,255,.7) inset,0 20px 40px -34px rgba(46,26,18,.5);margin-bottom:16px}
.card h3{font-size:21px;margin-bottom:4px}
.card .hint{font-size:13px;color:var(--cocoa2)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stat{background:var(--paper);border-radius:20px;padding:16px 18px}
.stat b{display:block;font-family:var(--spartan);font-weight:900;font-size:34px;line-height:1}
.stat span{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--cocoa2)}
.row{display:flex;align-items:center;gap:14px}
.row .grow{flex:1;min-width:0}
.field{display:grid;gap:6px;margin-top:14px}
.field label{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--cocoa2)}
.field input,.field textarea,.field select{width:100%;min-height:48px;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:#fff;font-size:16px}
.field input:focus,.field textarea:focus{outline:0;border-color:var(--cocoa)}
.field .pre{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:14px;background:#fff;overflow:hidden}
.field .pre span{padding:0 12px;font-weight:700;color:var(--cocoa2);background:var(--sand);align-self:stretch;display:grid;place-items:center}
.field .pre input{border:0;border-radius:0}
.fields3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.fields4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
/* switch */
.sw{position:relative;width:54px;height:32px;border-radius:16px;background:#CDBBA0;flex:none;transition:background .25s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25);transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
.sw[aria-checked="true"]{background:var(--ok)}
.sw[aria-checked="true"]::after{transform:translateX(22px)}
.sw.red[aria-checked="true"]{background:var(--bad)}
.bigsw{display:flex;align-items:center;gap:18px}
.bigsw .t b{font-family:var(--spartan);font-weight:900;font-size:24px;display:block}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:middle}
.annprev{margin-top:14px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--cocoa);color:var(--paper);font-size:13px;font-weight:600;padding:0 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.annprev.closed{background:var(--bad)}
.annprev.off{opacity:.35}
/* quick sold-out chips */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{display:flex;align-items:center;gap:8px;height:42px;padding:0 14px 0 5px;border-radius:999px;background:#fff;box-shadow:inset 0 0 0 1.5px var(--line);font-weight:600;font-size:14px}
.chip i{width:32px;height:32px;border-radius:50%;background:linear-gradient(to bottom,#F4EAD8 54%,var(--c) 54%)}
.chip[aria-pressed="true"]{background:#FBE4E1;box-shadow:inset 0 0 0 1.5px var(--bad);color:var(--bad);text-decoration:line-through}
/* flavor list */
.fl{display:grid;gap:10px}
.fitem{display:grid;grid-template-columns:auto 64px minmax(0,1fr) auto;align-items:center;gap:14px;background:var(--paper);border-radius:20px;padding:10px 14px 10px 8px}
.fitem.hid{opacity:.55}
.fitem .ord{display:grid;gap:2px}
.fitem .ord button{width:30px;height:24px;border-radius:8px;display:grid;place-items:center;color:var(--cocoa2)}
.fitem .ord button:hover{background:var(--sand)}
.fitem .ord svg{width:14px;height:14px}
.fitem img{width:64px;height:64px;border-radius:50%;object-fit:cover;object-position:50% 40%;box-shadow:0 0 0 3px var(--c)}
.fitem b{font-family:var(--spartan);font-weight:900;font-size:19px;display:block;line-height:1.1}
.fitem small{color:var(--cocoa2);font-size:12.5px}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.tg{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--sand)}
.tg.out{background:#FBE4E1;color:var(--bad)}.tg.new{background:var(--cocoa);color:var(--paper)}.tg.hid{background:#ddd}
.fitem .acts{display:flex;align-items:center;gap:8px}
/* promos */
.prow{display:grid;grid-template-columns:minmax(0,1fr) 110px auto auto;gap:10px;align-items:end;padding:12px 0;border-bottom:1px dashed var(--line)}
.prow .field{margin-top:0}
.iconbtn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:#fff;box-shadow:inset 0 0 0 1.5px var(--line)}
.iconbtn svg{width:18px;height:18px}
.iconbtn.del:hover{color:var(--bad);box-shadow:inset 0 0 0 1.5px var(--bad)}
.calc{margin-top:16px;padding:14px 16px;border-radius:16px;background:var(--sand);font-size:14px}
.calc b{font-family:var(--spartan);font-weight:900}
/* editor modal */
.ov{position:fixed;inset:0;z-index:40;background:rgba(46,26,18,.45);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.modal{position:fixed;z-index:41;left:50%;top:50%;transform:translate(-50%,-50%);width:min(760px,calc(100% - 24px));max-height:calc(100% - 32px);overflow:auto;background:var(--sand);border-radius:28px;padding:24px;overscroll-behavior:contain}
.modal .mh{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.modal .mh h3{font-size:28px;flex:1}
.ed{display:grid;grid-template-columns:200px minmax(0,1fr);gap:22px}
.phbox{position:relative;border-radius:22px;overflow:hidden;aspect-ratio:3/4;background:var(--sand2);display:grid;place-items:center}
.phbox img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.phbox label{position:absolute;left:10px;right:10px;bottom:10px;display:flex;align-items:center;justify-content:center;gap:6px;height:40px;border-radius:999px;background:rgba(46,26,18,.85);color:#fff;font-weight:700;font-size:13px;cursor:pointer}
.phbox input{position:absolute;opacity:0;width:1px;height:1px}
.phbox label svg{width:18px;height:18px;flex:none}
.lidprev{margin-top:14px;width:120px;height:120px;border-radius:50%;margin-inline:auto;background:linear-gradient(to bottom,#F4EAD8 56%,var(--c) 56%);box-shadow:0 14px 24px -12px rgba(0,0,0,.5),inset 0 0 0 2px rgba(255,255,255,.6);display:grid;place-items:center;text-align:center;font-family:var(--spartan);font-weight:900;font-size:13px;line-height:1.1;color:var(--ink);padding:0 14px 30px}
.colors{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.colors input[type=color]{width:100%;height:48px;padding:4px;border-radius:14px;border:1.5px solid var(--line);background:#fff}
.togs{display:grid;gap:12px;margin-top:16px}
.tog{display:flex;align-items:center;gap:12px;font-weight:600}
.tog small{display:block;font-weight:400;color:var(--cocoa2);font-size:12.5px}
.mf{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
.mf .sp{flex:1}
/* orders */
.otabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 14px}
.otab{height:40px;padding:0 14px;border-radius:999px;font-weight:600;font-size:14px;background:var(--paper);box-shadow:inset 0 0 0 1.5px var(--line)}
.otab[aria-pressed="true"]{background:var(--cocoa);color:var(--paper);box-shadow:none}
.otab small{opacity:.7;margin-left:4px}
.osearch{width:100%;min-height:46px;padding:0 16px;border-radius:14px;border:1.5px solid var(--line);background:#fff;font-size:16px;margin-bottom:14px}
.olist{display:grid;gap:12px}
.ocard{background:var(--paper);border-radius:22px;padding:18px 18px 16px;box-shadow:0 20px 40px -34px rgba(46,26,18,.5);border-left:6px solid var(--sc,#999)}
.ocard.st-new{--sc:#D97706;background:#FFF8EA}.ocard.st-confirmed{--sc:#2563EB}.ocard.st-delivered{--sc:var(--ok)}.ocard.st-cancelled{--sc:#9CA3AF;opacity:.7}
.oh{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.oh b{font-family:var(--spartan);font-weight:900;font-size:20px}
.oh .when{margin-left:auto;font-size:12.5px;color:var(--cocoa2);font-weight:600}
.pill{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:4px 10px;border-radius:999px;color:#fff;background:var(--sc)}
.cust{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px}
.cust b{font-size:17px;margin-right:4px}
.cust a{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:999px;background:#fff;box-shadow:inset 0 0 0 1.5px var(--line);text-decoration:none;font-weight:600;font-size:13.5px}
.cust a.wa{background:#25D366;color:#fff;box-shadow:none}
.cust svg{width:15px;height:15px}
.addr,.onote{font-size:14px;margin-top:8px;color:var(--cocoa2)}
.oitems{list-style:none;display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.oitems li{font-size:13px;font-weight:600;padding:5px 10px;border-radius:999px;background:var(--sand)}
.otot{margin-top:10px;font-size:14px}
.otot b{font-family:var(--spartan);font-weight:900;font-size:20px}
.otot small{color:var(--cocoa2)}
.oact{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.oact .btn{height:40px}
.btn.blue{background:#2563EB}.btn.green{background:var(--ok)}
.topfl{display:grid;gap:8px;margin-top:10px}
.topfl div{display:grid;grid-template-columns:110px 1fr 40px;gap:10px;align-items:center;font-size:13.5px;font-weight:600}
.topfl i{display:block;height:12px;border-radius:6px;background:var(--c,var(--cocoa))}
.topfl span:last-child{text-align:right;font-family:var(--spartan);font-weight:900}
.empty-o{text-align:center;padding:40px 10px;color:var(--cocoa2)}
.empty-o b{display:block;font-family:var(--spartan);font-weight:900;font-size:22px;color:var(--cocoa);margin-bottom:6px}

/* toast + publish overlay */
.toast{position:fixed;left:50%;bottom:24px;z-index:60;transform:translate(-50%,20px);opacity:0;background:var(--cocoa);color:var(--paper);padding:12px 18px;border-radius:999px;font-weight:600;font-size:14px;transition:opacity .3s,transform .35s;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.pub{position:fixed;inset:0;z-index:70;display:grid;place-items:center;background:rgba(46,26,18,.55);padding:20px}
.pub .box{width:min(420px,100%);background:var(--paper);border-radius:28px;padding:30px 26px;text-align:center}
.pub h3{font-size:28px;margin:12px 0 6px}
.pub p{color:var(--cocoa2)}
.spin{width:54px;height:54px;border-radius:50%;border:5px solid var(--sand2);border-top-color:var(--cocoa);margin:0 auto;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.steps{list-style:none;text-align:left;margin:16px 0 6px;display:grid;gap:6px;font-size:14px}
.steps li::before{content:"○ ";color:var(--cocoa2)}
.steps li.done::before{content:"✓ ";color:var(--ok);font-weight:800}
.demo-note{background:#FFE7B8;color:#5A3A00;border-radius:16px;padding:12px 16px;font-size:13.5px;margin-bottom:16px}

@media (max-width:860px){
  .layout{grid-template-columns:minmax(0,1fr);gap:12px;padding-top:12px}
  .nav,.page{min-width:0}
  .nav{position:sticky;top:66px;z-index:10;display:flex;overflow-x:auto;gap:6px;padding:6px 0 10px;background:var(--sand);scrollbar-width:none;margin:0 calc(-1 * clamp(14px,3vw,28px));padding-inline:clamp(14px,3vw,28px)}
  .nav::-webkit-scrollbar{display:none}
  .nav button{flex:none;height:42px;white-space:nowrap}
  .grid2{grid-template-columns:minmax(0,1fr)}
  .card,.field,.field input{min-width:0}
  .grid4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ed{grid-template-columns:1fr}
  .phbox{max-width:220px;margin-inline:auto;width:100%}
  .top .who{display:none}
  .fields4{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:560px){
  .top img{height:28px}
  .status{display:none}
  .btn{padding:0 14px;font-size:14px}
  #previewBtn span{display:none}
  .fitem{grid-template-columns:auto 52px minmax(0,1fr);row-gap:8px}
  .fitem img{width:52px;height:52px}
  .fitem .acts{grid-column:1/-1;justify-content:flex-end}
  .prow{grid-template-columns:minmax(0,1fr) 90px;}
  .fields3{grid-template-columns:1fr 1fr}
  .colors{grid-template-columns:repeat(2,minmax(0,1fr))}
}
</style>
</head>
<body>

<!-- LOGIN -->
<main class="login" id="login">
  <div class="box">
    <img src="assets/logo-brown.png" alt="AK Brand · Healthy Eats">
    <h1>Owner panel</h1>
    <p class="s">Change flavors, prices and promos. Your website updates in about a minute.</p>
    <form id="loginForm" novalidate>
      <div class="field"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" placeholder="Your owner password"></div>
      <p class="err" id="loginErr"></p>
      <button class="btn" type="submit" style="width:100%;margin-top:14px" id="loginBtn">Sign in</button>
      <p class="s" style="font-size:12.5px;margin:12px 0 0">You'll stay signed in on this device for 30 days.</p>
    </form>
  </div>
</main>

<!-- APP -->
<div id="app" hidden>
  <header class="top">
    <img src="assets/logo-brown.png" alt="AK Brand">
    <div class="who"><b>Owner panel</b><span id="whoTxt"></span></div>
    <span class="sp"></span>
    <span class="status" id="status">All published</span>
    <button class="btn ghost" type="button" id="previewBtn" title="Preview your changes on the website"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><span>Preview</span></button>
    <button class="btn" type="button" id="publishBtn" disabled>Publish</button>
  </header>
  <div class="layout">
    <nav class="nav" id="nav" aria-label="Sections">
      <button type="button" data-p="orders" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>Orders<span class="n" id="ordBadge" hidden>0</span></button>
      <button type="button" data-p="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Today</button>
      <button type="button" data-p="flavors"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="8" rx="8" ry="3"/><path d="M4 8l1.5 10a2 2 0 0 0 2 1.7h9a2 2 0 0 0 2-1.7L20 8"/></svg>Flavors</button>
